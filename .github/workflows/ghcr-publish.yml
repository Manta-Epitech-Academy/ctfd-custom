name: Publish to GHCR

on:
  release:
    types: [published]
  push:
    branches:
      - master
      - yolo
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: latest

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set image name and tags
        id: image
        run: |
          if [ "${{ github.ref }}" = "refs/heads/yolo" ]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            image_name="ghcr.io/${owner@L}/ctfd-yolo"
          elif [ -n "${{ vars.GHCR_IMAGE_NAME }}" ]; then
            image_name="${{ vars.GHCR_IMAGE_NAME }}"
          else
            image_name="ghcr.io/${GITHUB_REPOSITORY@L}"
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            image_tag="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            image_tag="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            image_tag="latest"
            image_tag_sha="sha-${GITHUB_SHA::7}"
          elif [ "${{ github.ref }}" = "refs/heads/yolo" ]; then
            image_tag="latest"
          else
            image_tag="${{ github.event.inputs.tag }}"
          fi

          # yolo has no workshop_platform submodule/vendoring, so it stays
          # multi-arch. Every other ref now bakes in a PyYAML wheel pinned to
          # manylinux2014_x86_64 (workshop_platform/tools/build_vendor.sh), so
          # build amd64 only there to avoid silently shipping a mismatched
          # wheel in an arm64 image.
          if [ "${{ github.ref }}" = "refs/heads/yolo" ]; then
            platforms="linux/amd64,linux/arm64"
          else
            platforms="linux/amd64"
          fi

          {
            echo "name=${image_name}"
            echo "tag=${image_tag}"
            echo "platforms=${platforms}"
            echo "tags<<EOF"
            echo "${image_name}:${image_tag}"
            if [ -n "${image_tag_sha:-}" ]; then
              echo "${image_name}:${image_tag_sha}"
            fi
            if [ "${image_tag}" != "latest" ]; then
              echo "${image_name}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.image.outputs.platforms }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tags }}

  # Rolls every CTFd instance so it picks up the image this run just pushed.
  # `needs: docker` is what makes it conditional on a successful build, and the
  # `if` keeps it to master: this workflow also fires on tags, releases, the
  # `yolo` branch and workflow_dispatch, none of which should touch the cluster.
  #
  # The deployments pull on every start (imagePullPolicy: Always in
  # jumper-k3s), so a restart is all that is needed; there is nothing to
  # re-tag or re-apply.
  restart-k3s:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<KUBECONFIG
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: ${{ secrets.K3S_URL }}
                insecure-skip-tls-verify: true
              name: k3s
          contexts:
            - context:
                cluster: k3s
                user: k3s-user
              name: k3s
          current-context: k3s
          users:
            - name: k3s-user
              user:
                token: ${{ secrets.K3S_TOKEN }}
          KUBECONFIG
          chmod 600 ~/.kube/config

      - name: Restart every CTFd instance
        run: |
          set -euo pipefail

          # Instances are found by the `app=ctfd` pod label rather than from a
          # list kept here: an instance added later is covered the day its
          # overlay is applied, and this file never has to know the topology.
          namespaces=$(kubectl get pods -A -l app=ctfd \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' | sort -u)
          if [ -z "$namespaces" ]; then
            echo "::error::No CTFd instance found in the cluster."
            exit 1
          fi

          echo "Restarting: $(echo "$namespaces" | tr '\n' ' ')"
          while read -r ns; do
            kubectl rollout restart deploy/ctfd -n "$ns"
          done <<< "$namespaces"

          failed=""
          while read -r ns; do
            if kubectl rollout status deploy/ctfd -n "$ns" --timeout=300s >/dev/null; then
              echo "  ok   $ns"
            else
              echo "  FAIL $ns"
              failed="$failed $ns"
            fi
          done <<< "$namespaces"

          if [ -n "$failed" ]; then
            echo "::error::Rollout did not complete for:$failed"
            exit 1
          fi
